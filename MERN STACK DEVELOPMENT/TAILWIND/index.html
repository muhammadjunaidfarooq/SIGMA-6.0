<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="border h-85 w-210 m-auto mt-20 flex flex-col rounded-lg">
        <h2
          class="h-25 bg-blue-400 text-3xl font-bold text-white flex items-center justify-center rounded-t-lg"
        >
          News you can trust
        </h2>
        <h2
          class="mt-5 text-2xl font-semibold text-black flex items-center justify-center"
        >
          Stay up to date with the Latest!
        </h2>
        <p class="flex items-center justify-center text-lg">
          Subscribe to our newsletter for the latest news straight into your
          inbox
        </p>
        <form class="flex items-center justify-center flex-col gap-3 mt-5">
          <input type="text" placeholder="you@example.com" class=" bg-blue-100 h-10 w-70 text-center" />
          <button class="bg-blue-400 h-10 w-70 rounded-4xl font-semibold text-white">Subscribe Now</button>
        </form>
        <p class="flex items-center justify-center text-lg mt-4">
          We value your privacy
        </p>
    </div>
  </body>
</html>
